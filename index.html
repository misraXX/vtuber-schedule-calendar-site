<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>配信スケジュール</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="auth-locked">
    <section class="auth-gate" aria-labelledby="authTitle">
      <form id="authForm" class="auth-card">
        <p class="brand-kicker">PRIVATE DEMO</p>
        <h1 id="authTitle">配信スケジュール</h1>
        <label>
          <span>パスワード</span>
          <input id="authPassword" type="password" autocomplete="current-password" />
        </label>
        <button class="primary-button" type="submit">表示する</button>
        <p id="authError" class="auth-error" aria-live="polite"></p>
      </form>
    </section>

    <header class="app-header">
      <div class="header-main">
        <div class="brand">
          <p class="brand-kicker">STREAM SCHEDULE</p>
          <h1>配信スケジュール</h1>
        </div>
        <div class="content-tabs" role="tablist" aria-label="表示内容">
          <button class="active" type="button" role="tab" aria-selected="true" data-content-mode="stream">配信</button>
          <button type="button" role="tab" aria-selected="false" data-content-mode="video">動画/Shorts</button>
        </div>
        <div class="header-actions">
          <button id="filterToggleButton" class="filter-toggle" type="button" aria-expanded="false" aria-controls="filterPanel">
            <span>フィルター</span>
            <strong id="activeFilterCount">0</strong>
          </button>
          <button class="icon-button" id="refreshButton" type="button" title="再読み込み" aria-label="再読み込み">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </div>

      <div id="filterPanel" class="controls collapsed">
        <label class="search-field">
          <span>検索</span>
          <input id="searchInput" type="search" placeholder="配信者、タイトル、ゲーム名" autocomplete="off" />
        </label>
        <label>
          <span>サイト</span>
          <select id="platformFilter">
            <option value="">すべて</option>
            <option value="YouTube">YouTube</option>
            <option value="Twitch">Twitch</option>
          </select>
        </label>
        <label>
          <span>状態</span>
          <select id="statusFilter">
            <option value="">すべて</option>
            <option value="live">LIVE中</option>
            <option value="scheduled">予定</option>
            <option value="unknown">不明</option>
          </select>
        </label>
        <label class="new-only-filter">
          <span>動画</span>
          <span class="toggle-check">
            <input id="newOnlyFilter" type="checkbox" />
            <span>NEWのみ</span>
          </span>
        </label>
        <details class="streamer-filter" open>
          <summary>
            <span>配信者</span>
            <strong id="streamerFilterSummary">すべて</strong>
          </summary>
          <div class="streamer-filter-actions">
            <button id="selectAllStreamersButton" type="button">すべて選択</button>
            <button id="clearStreamersButton" type="button">解除</button>
          </div>
          <div id="streamerCheckboxes" class="streamer-checkboxes"></div>
        </details>
      </div>
    </header>

    <main class="layout">
      <section class="live-strip" aria-labelledby="liveTitle">
        <div class="section-heading">
          <h2 id="liveTitle">LIVE中</h2>
          <span id="liveCount" class="count-pill">0</span>
        </div>
        <div class="live-rail">
          <button class="live-scroll-button live-scroll-left" id="liveScrollLeft" type="button" aria-label="左へスクロール">‹</button>
          <div id="liveList" class="live-list"></div>
          <button class="live-scroll-button live-scroll-right" id="liveScrollRight" type="button" aria-label="右へスクロール">›</button>
        </div>
      </section>

      <section class="calendar-shell" aria-live="polite">
        <div class="calendar-sticky-head">
          <div class="calendar-topline">
            <div>
              <h2 id="rangeTitle">配信予定</h2>
            </div>
            <div class="calendar-actions">
              <div class="date-navigation" aria-label="日付移動">
                <button class="icon-button" id="prevRangeButton" type="button" title="前の期間" aria-label="前の期間">‹</button>
                <button class="today-button" id="todayRangeButton" type="button">今日</button>
                <button class="icon-button" id="nextRangeButton" type="button" title="次の期間" aria-label="次の期間">›</button>
              </div>
            </div>
            <p id="updatedAt" class="muted"></p>
          </div>
        </div>
        <div id="calendarDays" class="calendar-days"></div>
      </section>
    </main>

    <template id="eventCardTemplate">
      <article class="event-card">
        <a class="thumb-link" target="_blank" rel="noopener noreferrer">
          <img class="thumb" alt="" loading="lazy" />
          <span class="status-badge"></span>
        </a>
        <div class="event-body">
          <div class="event-meta">
            <img class="avatar" alt="" loading="lazy" />
            <div>
              <p class="streamer"></p>
              <p class="time"></p>
            </div>
          </div>
          <a class="event-title" target="_blank" rel="noopener noreferrer"></a>
          <div class="event-footer">
            <span class="platform"></span>
            <span class="content-type-label"></span>
            <button class="watched-button" type="button" hidden></button>
          </div>
        </div>
      </article>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
